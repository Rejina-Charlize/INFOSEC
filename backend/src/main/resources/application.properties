spring.application.name=medstock-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medstock}
spring.datasource.username=${DB_USERNAME:medstock}
spring.datasource.password=${DB_PASSWORD:medstock}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jackson.serialization.write-dates-as-timestamps=false
medstock.admin.username=${MEDSTOCK_ADMIN_USERNAME:}
medstock.admin.password=${MEDSTOCK_ADMIN_PASSWORD:}
medstock.pharmacist.username=${MEDSTOCK_PHARMACIST_USERNAME:}
medstock.pharmacist.password=${MEDSTOCK_PHARMACIST_PASSWORD:}
medstock.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
