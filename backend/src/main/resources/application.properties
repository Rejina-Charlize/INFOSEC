spring.application.name=medstock-api
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medstock}
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.auto-index-creation=true
spring.jackson.serialization.write-dates-as-timestamps=false
medstock.admin.username=${MEDSTOCK_ADMIN_USERNAME:}
medstock.admin.password=${MEDSTOCK_ADMIN_PASSWORD:}
medstock.pharmacist.username=${MEDSTOCK_PHARMACIST_USERNAME:}
medstock.pharmacist.password=${MEDSTOCK_PHARMACIST_PASSWORD:}
medstock.demo-data.enabled=${MEDSTOCK_DEMO_DATA:false}
medstock.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
medstock.jwt.secret=${JWT_SECRET:}
medstock.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
